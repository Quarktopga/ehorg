<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ehorg AI — Web</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap">
<style>
html,body{margin:0;width:100%;height:100%;background:#FAF9F6}
body{font-family:'DM Sans',Arial,sans-serif}
#wrap,#stage,#app{width:100%;height:100%;min-height:0}
#stage{box-shadow:none}
button{font-family:inherit;-webkit-tap-highlight-color:transparent}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid #3B4CCA;outline-offset:2px}
.sheet{animation:up .22s ease-out}
.drawer{animation:in .22s ease-out}
.orb{animation:pulse 2.6s ease-in-out infinite}
.dot{animation:blink 1.1s infinite ease-in-out}
@keyframes up{from{transform:translateY(28px);opacity:0}to{transform:none;opacity:1}}
@keyframes in{from{transform:translateX(-32px);opacity:0}to{transform:none;opacity:1}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
@media (prefers-reduced-motion: reduce){.sheet,.drawer,.orb,.dot{animation:none}}

::selection{background:#D9DDFB;color:#202B83}
::-moz-selection{background:#D9DDFB;color:#202B83}
.answer-body{font-size:15px;line-height:1.7;overflow-wrap:anywhere}
.answer-body h3{font-size:21px;line-height:1.3;letter-spacing:-.5px;margin:8px 0 14px}
.answer-body p{margin:0 0 12px;white-space:pre-wrap}
.answer-body p:last-child{margin:14px 0 4px;padding:12px 14px;border-left:3px solid #7884DC;background:#F0F1FA;border-radius:0 12px 12px 0}
.power-track{position:relative;height:56px;border-radius:8px;background:#EFEDE7;box-shadow:inset 0 0 0 1px #D3CFC4,inset 0 2px 4px #14171F12;overflow:hidden}
.power-track:focus-within{outline:2px solid #3B4CCA;outline-offset:2px}
.power-rail{position:absolute;inset:0}
.power-rail:after{content:'';position:absolute;left:11px;right:11px;inset-block:0;background:linear-gradient(90deg,#B8B4A8 1px,transparent 1px);background-size:33.333% 100%;pointer-events:none;opacity:.45}
.power-fill{height:100%;border-radius:0;background:linear-gradient(90deg,#E7E9FA,#B9BFEE);transition:width .3s ease}
.power-thumb{position:absolute;top:0;bottom:0;width:22px;border-radius:5px;background:linear-gradient(90deg,#4C5CD8,#3B4CCA 50%,#2F3DAA);box-shadow:0 2px 6px #14171F59,inset 0 0 0 1px #ffffff47;transition:left .3s cubic-bezier(.2,.8,.2,1);pointer-events:none;animation:power-glow 3s ease-in-out infinite}
.power-thumb:after{content:'';position:absolute;left:7px;top:17px;width:2px;height:22px;background:#ffffffbf;box-shadow:6px 0 0 #ffffffbf}
@keyframes power-glow{50%{box-shadow:0 2px 10px #3B4CCA66,inset 0 0 0 1px #ffffff66}}
@media(prefers-reduced-motion:reduce){.power-thumb{animation:none}.power-fill,.power-thumb{transition:none}}


/* Interface web : navigation latérale et conversation centrée. */
.web-shell{width:100%!important;height:100vh!important;height:100dvh!important;box-sizing:border-box}
.desktop-nav{display:none}
.chat-scroll{width:min(100%,840px);align-self:center;box-sizing:border-box}
.chat-composer{width:min(100%,840px);align-self:center;box-sizing:border-box}
.chat-composer > div:last-child{box-shadow:0 5px 22px #292b3c0a}
.screen-content{width:min(100%,900px);align-self:center;box-sizing:border-box}
.cover{width:100%!important;height:100%!important;z-index:10}
.voice-screen{width:100%!important;height:100%!important;z-index:5}
.drawer{height:100%!important;max-width:90vw;z-index:11}
.sheet{width:min(100%,500px)!important;max-height:min(780px,92dvh)!important;left:50%!important;transform:translateX(-50%);z-index:11;box-shadow:0 20px 70px #14171f26}
.sheet{animation:web-up .22s ease-out}
@keyframes web-up{from{transform:translate(-50%,24px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
@media(min-width:900px){
 .web-shell.is-chat{padding-left:280px}
 .desktop-nav{display:flex;position:absolute;left:0;top:0;bottom:0;width:280px;box-sizing:border-box;background:#F1F0EA;border-right:1px solid #E3E0D7;padding:25px 18px 18px;flex-direction:column;gap:15px}
 .desktop-nav .brand{display:flex;align-items:center;gap:10px;padding:0 8px 12px;font-size:22px;font-weight:700;letter-spacing:-.7px}
 .desktop-nav .new-chat{display:flex;align-items:center;gap:10px;min-height:48px;border:1px solid #DCD9D1;background:#fff;border-radius:13px;padding:0 13px;font-size:14px;font-weight:700;text-align:left;cursor:pointer;color:#252839}
 .desktop-nav .new-chat:hover,.desktop-nav .history-row:hover{background:#E9E8E2}
 .desktop-nav .search{width:100%;height:42px;box-sizing:border-box;border:0;background:#E7E5DE;border-radius:11px;padding:0 12px;font:inherit;font-size:14px;color:#14171F}
 .desktop-nav .history{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:2px}
 .desktop-nav .history-label{padding:15px 10px 7px;color:#83858F;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px}
 .desktop-nav .history-row{display:flex;border-radius:10px;align-items:center}
 .desktop-nav .history-row button{border:0;background:transparent;cursor:pointer;color:#555966}
 .desktop-nav .history-title{flex:1;min-width:0;text-align:left;padding:11px 10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
 .desktop-nav .history-delete{padding:10px;font-size:17px}
 .desktop-nav .quota{border:1px solid #E0DDD4;border-radius:14px;background:#FAF9F6;padding:14px;text-align:left;cursor:pointer;color:#252839}
 .desktop-nav .account{border:0;border-top:1px solid #DFDCD3;padding:16px 6px 0;background:transparent;display:flex;gap:10px;align-items:center;text-align:left;cursor:pointer;color:#252839}
 .chat-header{padding:20px 32px!important;border-bottom:1px solid #F0EEE8}
 .chat-header .mobile-history{display:none!important}
 .chat-header .header-brand{font-size:14px!important;color:#7D808B}
 .chat-scroll{padding:36px 36px 24px!important;gap:30px!important}
 .welcome{padding-bottom:55px!important}
 .welcome > svg{width:60px;height:60px;margin-bottom:10px;filter:drop-shadow(0 8px 18px #3B4CCA22)}
 .welcome-intro{max-width:460px;font-size:15px;color:#7A7D89;line-height:1.55;margin:0 0 14px}
 .starter-list{gap:10px!important;margin-top:0!important}
 .starter-button{padding:0 20px!important;min-height:44px!important;border-radius:14px!important;font-size:14px!important;transition:border-color .2s,background .2s,transform .2s}
 .starter-button:hover{border-color:#B5BCEB!important;background:#F2F3FC!important;transform:translateY(-2px)}
 .user-message>div{max-width:min(70%,540px)!important;padding:13px 18px!important}
 .ai-message{padding-right:15px;gap:11px!important}
 .answer-body{font-size:16px;line-height:1.75}
 .answer-body h3{font-size:24px}
 .chat-composer > div:last-child{box-shadow:0 8px 32px #292B3C0c,0 2px 8px #292B3C08}
 .chat-composer{padding:8px 36px 30px!important}
 .chat-composer > div:last-child{border-radius:22px!important;padding:10px 12px 10px 16px!important}
 .chat-scroll h1{font-size:36px!important;letter-spacing:-1.1px}
 .screen-content{padding:24px 32px 48px!important}
 .screen-header{padding:20px 32px!important;border-bottom:1px solid #F0EEE8}
 .sheet{bottom:24px!important;border-radius:24px!important}
}
.welcome-intro{margin:0;color:#7A7D89;font-size:14px;line-height:1.5}
@media(max-width:899px){.chat-header{padding-inline:12px!important}.chat-scroll{padding-inline:20px!important}.chat-composer{padding-inline:16px!important}}
@media(prefers-reduced-motion:reduce){.sheet{animation:none}}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><div id="app"></div></div></div>
<template id="tpl">
<div class="web-shell {{ shellClass }}" style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #FAF9F6; color: #14171F; font-family: 'DM Sans', Arial, sans-serif; display: flex; flex-direction: column">

<!-- ===== CHAT ===== -->
<sc-if value="{{ isChat }}" hint-placeholder-val="{{ true }}">
<aside class="desktop-nav" aria-label="Navigation et historique">
<div class="brand"><svg aria-hidden="true" width="29" height="29" viewBox="0 0 32 32"><circle cx="16" cy="16" r="13" fill="none" stroke="#3B4CCA" stroke-width="3"/><circle cx="16" cy="16" r="5" fill="#3B4CCA"/></svg>Ehorg</div>
<button type="button" class="new-chat" onClick="{{ newChat }}"><svg width="19" height="19" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Nouvelle conversation</button>
<label for="web-search" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Rechercher dans les conversations</label>
<input id="web-search" class="search" type="search" placeholder="Rechercher une conversation" value="{{ query }}" onChange="{{ onQuery }}">
<div class="history"><span class="history-label">Vos conversations</span>
<sc-if value="{{ noChatsFound }}"><p style="font-size:13px;color:#83858F;padding:0 10px">Aucune conversation trouvée.</p></sc-if>
<sc-for list="{{ chatRows }}" as="ch"><sc-if value="{{ ch.isHead }}"><span class="history-label">{{ ch.head }}</span></sc-if><sc-if value="{{ ch.isRow }}"><div class="history-row" style="background:{{ ch.bg }}"><button type="button" class="history-title" onClick="{{ ch.open }}">{{ ch.title }}</button><button type="button" class="history-delete" aria-label="Supprimer la conversation" onClick="{{ ch.remove }}">×</button></div></sc-if></sc-for>
</div>
<button type="button" class="quota" onClick="{{ drawerUsage }}" aria-label="Voir l’utilisation détaillée"><span style="display:flex;justify-content:space-between;gap:5px;font-size:12px;font-weight:700"><span>Quota du compte</span><span style="color:{{ quotaFg }}">{{ quotaShort }}</span></span><span style="display:block;height:6px;background:#E8E6E0;border-radius:4px;margin:10px 0 7px;overflow:hidden"><span style="display:block;height:100%;width:{{ pct }}%;background:{{ quotaFill }}"></span></span><span style="font-size:11px;color:#81838D">Partagé entre tous les modèles</span></button>
<button type="button" class="account" onClick="{{ openSettings }}"><span style="width:36px;height:36px;border-radius:12px;background:#3B4CCA;color:white;display:grid;place-items:center;font-weight:700">V</span><span style="flex:1;display:flex;flex-direction:column;gap:2px;font-size:13px;font-weight:700">Vous <span style="font-size:12px;font-weight:400;color:#858791">Ehorg {{ planName }}</span></span><span aria-hidden="true" style="font-size:18px;color:#81838D">⚙</span></button>
</aside>

<header class="chat-header" style="flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between; padding: 14px 8px 6px">
<button class="mobile-history" type="button" onClick="{{ openDrawer }}" aria-label="Ouvrir l’historique" style="width: 44px; height: 44px; border: 0; background: transparent; color: #14171F; cursor: pointer; display: flex; align-items: center; justify-content: center">
<svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 8h12"/><path d="M4 16h16"/></svg>
</button>
<div class="header-brand" style="display: flex; align-items: center; gap: 8px; min-height: 44px"><svg aria-hidden="true" width="26" height="26" viewBox="0 0 32 32"><circle cx="16" cy="16" r="13" fill="none" stroke="#3B4CCA" stroke-width="3"/><circle cx="16" cy="16" r="5" fill="#3B4CCA"/></svg><span style="font-size: 19px; font-weight: 700">Ehorg</span></div>
<button type="button" onClick="{{ newChat }}" aria-label="Nouvelle conversation" style="width: 44px; height: 44px; border: 0; background: transparent; color: #14171F; cursor: pointer; display: flex; align-items: center; justify-content: center">
<svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
</button>
</header>

<div class="chat-scroll" style="flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 8px 16px 12px; display: flex; flex-direction: column; gap: 22px">
<sc-if value="{{ noMessages }}" hint-placeholder-val="{{ true }}">
<div class="welcome" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding-bottom: 24px; text-align: center">
<svg aria-hidden="true" width="52" height="52" viewBox="0 0 32 32"><circle cx="16" cy="16" r="13" fill="none" stroke="#3B4CCA" stroke-width="3"/><circle cx="16" cy="16" r="5" fill="#3B4CCA"/></svg>
<h1 style="margin: 0; font-size: 28px; line-height: 1.2; font-weight: 700">Comment puis-je vous aider ?</h1>
<p class="welcome-intro">Une idée, une question, un projet ? Commençons ensemble.</p>
<div class="starter-list" style="display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 8px">
<sc-for list="{{ starters }}" as="st" hint-placeholder-count="4">
<button type="button" class="starter-button" onClick="{{ st.pick }}" style="min-height: 44px; padding: 0 16px; border-radius: 22px; border: 1px solid #E2DFD6; background: #FFFFFF; color: #14171F; font-size: 15px; font-weight: 500; cursor: pointer">{{ st.label }}</button>
</sc-for>
</div>
</div>
</sc-if>

<sc-for list="{{ messages }}" as="m" hint-placeholder-count="2">
<sc-if value="{{ m.isUser }}" hint-placeholder-val="{{ true }}">
<div class="user-message" style="display: flex; flex-direction: column; align-items: flex-end; gap: 6px">
<sc-if value="{{ m.hasChips }}" hint-placeholder-val="{{ false }}"><span style="font-size: 13px; color: #5E6270">{{ m.chipText }}</span></sc-if>
<div style="max-width: 300px; background: #EFEDE7; padding: 10px 16px; border-radius: 20px 20px 6px 20px; font-size: 16px; line-height: 1.45; white-space: pre-wrap">{{ m.text }}</div>
</div>
</sc-if>
<sc-if value="{{ m.isAi }}" hint-placeholder-val="{{ false }}">
<div class="ai-message" style="display: flex; flex-direction: column; gap: 8px">
<sc-if value="{{ m.pending }}" hint-placeholder-val="{{ false }}">
<div role="status" aria-label="Ehorg réfléchit" style="display: flex; align-items: center; gap: 5px; min-height: 28px">
<span class="dot" style="width: 8px; height: 8px; border-radius: 4px; background: #3B4CCA"></span>
<span class="dot" style="width: 8px; height: 8px; border-radius: 4px; background: #3B4CCA; animation-delay: .18s"></span>
<span class="dot" style="width: 8px; height: 8px; border-radius: 4px; background: #3B4CCA; animation-delay: .36s"></span>
<span style="margin-left: 6px; font-size: 14px; color: #5E6270">{{ m.pendingText }}</span>
</div>
</sc-if>
<sc-if value="{{ m.done }}" hint-placeholder-val="{{ true }}">
<sc-if value="{{ m.thought }}" hint-placeholder-val="{{ false }}">
<span style="align-self: flex-start; padding: 4px 12px; border-radius: 14px; background: #E7E9FA; color: #2A3799; font-size: 13px; font-weight: 600">{{ m.thoughtText }}</span>
</sc-if>
<div style="display:flex;align-items:center;gap:7px;font-size:12px;font-weight:700;color:#3B4CCA;letter-spacing:.3px"><span style="width:7px;height:7px;border-radius:50%;background:#3B4CCA"></span> EHORG <span style="font-weight:400;color:#868995">· Réponse de démonstration</span></div>
<sc-rich value="{{ m }}"></sc-rich>
<span style="font-size: 12px; color: #5E6270">{{ m.meta }}</span>
<div style="display: flex; gap: 0; margin-left: -10px">
<button type="button" onClick="{{ m.copy }}" aria-label="Copier la réponse" style="width: 44px; height: 44px; border: 0; background: transparent; color: #5E6270; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg></button>
<button type="button" onClick="{{ m.like }}" aria-label="Bonne réponse" aria-pressed="{{ m.liked }}" style="width: 44px; height: 44px; border: 0; background: transparent; color: {{ m.likeFg }}; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 11v9H3v-9Z"/><path d="M7 11l4-8a2.5 2.5 0 0 1 2.5 3L13 10h6a2 2 0 0 1 2 2.3l-1.2 6A2 2 0 0 1 17.8 20H7"/></svg></button>
<button type="button" onClick="{{ m.retry }}" aria-label="Régénérer la réponse" style="width: 44px; height: 44px; border: 0; background: transparent; color: #5E6270; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg></button>
</div>
</sc-if>
</div>
</sc-if>
</sc-for>
</div>

<sc-if value="{{ limitHit }}" hint-placeholder-val="{{ false }}">
<div role="alert" style="margin: 0 12px 8px; padding: 14px 16px; border-radius: 16px; background: #FBEFE4; color: #6B2F0A; display: flex; flex-direction: column; gap: 10px; font-size: 14px; line-height: 1.45">
<span><b>{{ limitTitle }}</b> {{ limitText }}</span>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-if value="{{ canSwitchLite }}" hint-placeholder-val="{{ true }}"><button type="button" onClick="{{ useLite }}" style="min-height: 44px; padding: 0 16px; border-radius: 22px; border: 1px solid #6B2F0A; background: transparent; color: #6B2F0A; font-size: 14px; font-weight: 600; cursor: pointer">Utiliser Lite</button></sc-if>
<sc-if value="{{ canUpgrade }}" hint-placeholder-val="{{ true }}"><button type="button" onClick="{{ upgradeNext }}" style="min-height: 44px; padding: 0 16px; border-radius: 22px; border: 0; background: #14171F; color: #FAF9F6; font-size: 14px; font-weight: 600; cursor: pointer">{{ upgradeLabel }}</button></sc-if>
<sc-if value="{{ canCredits }}" hint-placeholder-val="{{ false }}"><button type="button" onClick="{{ addCredits }}" style="min-height: 44px; padding: 0 16px; border-radius: 22px; border: 0; background: #14171F; color: #FAF9F6; font-size: 14px; font-weight: 600; cursor: pointer">Ajouter des crédits</button></sc-if>
</div>
</div>
</sc-if>
<sc-if value="{{ lowQuota }}" hint-placeholder-val="{{ false }}">
<div style="margin: 0 12px 8px; padding: 8px 14px; border-radius: 14px; background: #FBEFE4; color: #6B2F0A; font-size: 13px; line-height: 1.4">{{ lowText }}</div>
</sc-if>

<sc-if value="{{ hasToast }}" hint-placeholder-val="{{ false }}">
<div role="status" style="align-self: center; margin-bottom: 8px; padding: 10px 18px; border-radius: 20px; background: #14171F; color: #FAF9F6; font-size: 14px; font-weight: 500">{{ toastText }}</div>
</sc-if>

<div class="chat-composer" style="flex: 0 0 auto; padding: 4px 12px 22px; display: flex; flex-direction: column; gap: 8px">
<sc-if value="{{ hasChips }}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-wrap: wrap; gap: 6px; padding: 0 4px">
<sc-for list="{{ chips }}" as="c" hint-placeholder-count="2">
<button type="button" onClick="{{ c.remove }}" aria-label="{{ c.aria }}" style="min-height: 36px; padding: 0 8px 0 14px; border-radius: 18px; border: 0; background: #E7E9FA; color: #2A3799; font-size: 14px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px">{{ c.label }}<svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
</sc-for>
</div>
</sc-if>
<div style="display: flex; flex-direction: column; background: #FFFFFF; border: 1px solid #E2DFD6; border-radius: 26px; padding: 4px 6px 6px 10px">
<label for="msg" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Message à Ehorg</label>
<textarea id="msg" rows="1" placeholder="Message à Ehorg" value="{{ draft }}" onChange="{{ onDraft }}" style="box-sizing: border-box; width: 100%; height: 48px; resize: none; border: 0; background: transparent; color: #14171F; font-family: inherit; font-size: 16px; line-height: 24px; padding: 12px 6px 12px 4px"></textarea>
<div style="display: flex; align-items: center; justify-content: space-between; gap: 6px">
<div style="display: flex; align-items: center; gap: 4px; min-width: 0">
<button type="button" onClick="{{ openPlus }}" aria-label="Ajouter des fichiers et des outils" style="flex: 0 0 44px; width: 44px; height: 44px; border: 0; border-radius: 22px; background: #EFEDE7; color: #14171F; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
<button type="button" onClick="{{ toggleMenu }}" aria-expanded="{{ menuOpen }}" aria-label="{{ selectorAria }}" style="min-height: 44px; padding: 0 10px; border: 0; border-radius: 22px; background: transparent; cursor: pointer; display: flex; align-items: center; gap: 7px; white-space: nowrap; font-size: 15px">
<span style="font-weight: 700; color: #14171F">{{ modelName }}</span>
<span style="font-weight: 500; color: #6B6F7A">{{ levelName }}</span>

</div>
</sc-for>

</div>
</section>

<section aria-labelledby="priv" style="display: flex; flex-direction: column; gap: 10px">

</sc-if>

</sc-if>
<div style="display: flex; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px solid #EFEDE7; font-size: 15px"><span>Authentification multifacteur</span><b>Activée</b></div>

</div>

</div>
</sc-if>

<aside class="drawer" aria-label="Historique" style="position: absolute; left: 0; top: 0; width: 320px; height: 844px; box-sizing: border-box; background: #FAF9F6; display: flex; flex-direction: column; padding: 14px 12px 12px; gap: 10px">

<div style="display: flex; align-items: center; gap: 8px"><svg aria-hidden="true" width="28" height="28" viewBox="0 0 32 32"><circle cx="16" cy="16" r="13" fill="none" stroke="#3B4CCA" stroke-width="3"/><circle cx="16" cy="16" r="5" fill="#3B4CCA"/></svg><span style="font-size: 20px; font-weight: 700">Ehorg</span></div>

</div>

<button type="button" onClick="{{ newChatClose }}" style="flex: 0 0 auto; min-height: 48px; border: 0; border-radius: 14px; background: #E7E9FA; color: #2A3799; display: flex; align-items: center; gap: 10px; padding: 0 14px; font-size: 16px; font-weight: 600; cursor: pointer"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>Nouvelle conversation</button>

<sc-for list="{{ chatRows }}" as="ch" hint-placeholder-count="5">

function makeReply(prompt) {
  if (/rédig|message|écri/i.test(prompt)) return 'Un message clair et chaleureux\n\nBonjour,\n\nMerci pour votre retour. Je vous propose que nous prenions un moment pour faire le point et définir ensemble les prochaines étapes.\n\nSeriez-vous disponible cette semaine ? Je m’adapterai volontiers à vos disponibilités.\n\nÀ retenir : précisez le destinataire et le contexte pour ajuster le ton de ce brouillon.';
  if (/appren|expli|révis/i.test(prompt)) return 'Apprendre, une étape à la fois\n\nCommencez par une idée simple : comprendre le principe avant de chercher à tout mémoriser.\n\n1. Découvrir — reformulez le sujet avec vos propres mots.\n\n2. Pratiquer — appliquez-le à un exemple concret.\n\n3. Vérifier — expliquez-le sans regarder vos notes.\n\nÀ retenir : une courte séance régulière permet de consolider ce que vous venez d’apprendre.';
  if (/cod|fonction/i.test(prompt)) return 'Passer de l’idée à une fonction\n\nDéfinissez d’abord les données d’entrée et le résultat attendu. Un exemple concret permet de lever les ambiguïtés.\n\n1. Décrire — nommez les paramètres et le type de résultat.\n\n2. Construire — écrivez une première version simple et lisible.\n\n3. Vérifier — essayez un cas courant, une entrée vide et une valeur inattendue.\n\nÀ préciser : le langage et un exemple d’entrée permettront de proposer du code adapté.';
  return 'Structurer votre prochaine étape\n\nPour votre demande « ' + prompt.slice(0,180) + ' », voici une première trame à adapter.\n\n1. Clarifier l’objectif — définissez le résultat que vous souhaitez obtenir.\n\n2. Organiser les éléments — rassemblez les informations utiles et les contraintes.\n\n3. Avancer concrètement — choisissez une première action simple, puis ajustez.\n\nÀ retenir : cette réponse illustre la mise en forme de la maquette. Elle est simulée.';
}
function firstPlan(test) {
  for (let i = 0; i < 4; i++) { if (test(i)) return i; }
  return 3;
}
function seg(sel, locked) {
  if (sel) return { bg: '#3B4CCA', fg: '#FAF9F6', bd: '#3B4CCA' };
  if (locked) return { bg: 'transparent', fg: '#6B6F7A', bd: '#E2DFD6' };
  return { bg: '#FFFFFF', fg: '#14171F', bd: '#D3CFC4' };
}

      choosePlan: () => { setPlan(sp); set({ screen: s.prev === 'plans' ? 'chat' : s.prev }); toast('Forfait ' + PLAN_NAMES[sp] + ' activé (démo)'); },
      orgOpen: s.orgOpen, toggleOrg: () => set({ orgOpen: !s.orgOpen }),
      // drawer
      query: s.query, onQuery: (e) => set({ query: e.target.value }),
      noChatsFound: chatRows.length === 0, chatRows,
      drawer: s.drawer, pct, acct: s.acct, toggleAcct: () => set({ acct: !s.acct }),
      drawerUsage: () => set({ screen: 'settings', drawer: false, acct: false }),
      drawerPlans: () => goPlans(pi, '', 'chat'),
      signOut: () => { set({ acct: false, drawer: false }); toast('Maquette : déconnexion simulée'); },
      quotaFill: pct < 15 ? '#9A3412' : '#3B4CCA', quotaFg: pct < 15 ? '#9A3412' : '#5E6270',
      quotaShort: pct + ' % restants',
      quotaLine: 'Partagé entre tous les modèles',
      canUpgradeDrawer: pi < 3, upgradeDrawerLabel: 'Passer à ' + PLAN_NAMES[nextPlan], upgradeDrawer: () => goPlans(nextPlan, ''),
      // sheets
      hasSheet: s.sheet === 'plus' || (s.menu && s.screen === 'chat'), sheetPlus: s.sheet === 'plus',
      modelRows, levelHint: LEVEL_HINT[s.level], boostOpts, ctxOpts,
      toolRows, attachCamera: () => addAttach('Photo prise'), attachPhoto: () => addAttach('Photo'), attachFile: () => addAttach('Fichier')
    };
  }
}

const app = document.getElementById('app');
const tpl = document.getElementById('tpl').content;
const comp = new Component({});
let queued = false;
function schedule() { if (queued) return; queued = true; Promise.resolve().then(() => { queued = false; render(); }); }
function lookup(path, scope) { const p = path.split('.'); let v = scope[p[0]]; for (let i = 1; i < p.length && v != null; i++) v = v[p[i]]; return v; }
const BIND = /\{\{\s*([\w.]+)\s*\}\}/g, ONE = /^\s*\{\{\s*([\w.]+)\s*\}\}\s*$/;
const interp = (str, scope) => str.replace(BIND, (m, p) => { const v = lookup(p, scope); return v == null ? '' : String(v); });
function build(node, scope) {
  if (node.nodeType === 3) return document.createTextNode(interp(node.data, scope));
  if (node.nodeType !== 1) return document.createComment('');
  const tag = node.localName;
  if (tag === 'sc-rich') {
    const m = lookup(ONE.exec(node.getAttribute('value'))[1], scope);
    const box = document.createElement('div'); box.className = 'answer-body'; box.dataset.message = m.index;
    m.text.split('\n\n').forEach((text, i) => {
      const p = document.createElement(i === 0 && m.title ? 'h3' : 'p');
      p.textContent = text; box.appendChild(p);
    });
    return box;
  }
  if (tag === 'sc-if') {
    const m = ONE.exec(node.getAttribute('value') || '');
    const ok = m && lookup(m[1], scope);
    const f = document.createDocumentFragment();
    if (!ok) return document.createComment('');
    const box = document.createElement('div'); box.style.display = 'contents';
    node.childNodes.forEach((c) => box.appendChild(build(c, scope)));
    return box;
  }
  if (tag === 'sc-for') {
    const m = ONE.exec(node.getAttribute('list') || '');
    const list = (m && lookup(m[1], scope)) || [];
    const as = node.getAttribute('as');
    const box = document.createElement('div'); box.style.display = 'contents';
    list.forEach((item) => { const sc = Object.create(scope); sc[as] = item; node.childNodes.forEach((c) => box.appendChild(build(c, sc))); });
    return box;
  }
  const el = document.createElementNS(node.namespaceURI, tag);
  for (const a of node.attributes) {
    const n = a.name, one = ONE.exec(a.value);
    if (n === 'onclick' || n === 'onchange') {
      const fn = one && lookup(one[1], scope);
      if (typeof fn === 'function') { if (n === 'onclick') el.onclick = (e) => fn(e); else el.oninput = (e) => fn(e); }
    } else if (n === 'value' && (tag === 'textarea' || tag === 'input')) {
      el.__v = interp(a.value, scope); if (tag === 'input') el.setAttribute('value', el.__v);
    } else if (n === 'disabled') {
      if (one ? lookup(one[1], scope) : true) el.setAttribute('disabled', '');
    } else if (n.indexOf('hint-') === 0) { /* repère de conception, ignoré */ }
    else el.setAttribute(n, interp(a.value, scope));
  }
  node.childNodes.forEach((c) => el.appendChild(build(c, scope)));
  if (el.__v !== undefined) el.value = el.__v;
  return el;
}
function sync(a, b) {
  if (a.nodeType !== b.nodeType || a.nodeName !== b.nodeName) { a.replaceWith(b); return; }
  if (a.nodeType === 3) { if (a.data !== b.data) a.data = b.data; return; }
  if (a.nodeType !== 1) return;
  for (const at of Array.from(a.attributes)) if (!b.hasAttribute(at.name)) a.removeAttribute(at.name);
  for (const at of Array.from(b.attributes)) if (a.getAttribute(at.name) !== at.value) a.setAttribute(at.name, at.value);
  a.onclick = b.onclick; a.oninput = b.oninput;
  const tn = a.nodeName;
  if (tn === 'TEXTAREA' || tn === 'INPUT') {
    if (b.__v !== undefined && a.value !== b.__v) a.value = b.__v;
    if (tn === 'TEXTAREA') return;
  }
  patch(a, b);
}
function patch(a, b) {
  const o = Array.from(a.childNodes), n = Array.from(b.childNodes);
  n.forEach((c, i) => { if (i < o.length) sync(o[i], c); else a.appendChild(c); });
  while (a.childNodes.length > n.length) a.removeChild(a.lastChild);
}
function render() {
  const vals = comp.renderVals();
  const next = document.createElement('div'); next.style.display = 'contents';
  tpl.childNodes.forEach((c) => next.appendChild(build(c, vals)));
  const root = app.firstElementChild;
  if (!root) { app.appendChild(next); } else { patch(root, next); }
}
render();
